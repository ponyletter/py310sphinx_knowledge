name: Auto Deploy & Build Sphinx

on:
  push:
    branches:
      - main

jobs:
  deploy-china:
    name: Deploy to China Server (81.69.190.161)
    runs-on: ubuntu-latest
    steps:
      - name: SSH and rebuild on China Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CHINA_SERVER_HOST }}
          port: ${{ secrets.CHINA_SERVER_PORT || 22 }}
          username: ${{ secrets.CHINA_SERVER_USER || 'root' }}
          password: ${{ secrets.CHINA_SERVER_PASSWORD }}
          command_timeout: 10m
          timeout: 60s
          script: |
            set -e
            echo "==== [China Server] Start pulling latest code ===="
            cd /root/02project/04mysite/py310sphinx_knowledge
            git checkout main
            git pull origin main
            echo "==== [China Server] Building Sphinx documentation ===="
            /root/miniconda3/envs/py310sphinx_knowledge/bin/sphinx-build -a -E -b html docs/source docs/build/html
            echo "==== [China Server] Deployment succeeded! ===="

  deploy-us:
    name: Deploy to US Server (204.44.67.184)
    runs-on: ubuntu-latest
    steps:
      - name: SSH and rebuild on US Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.US_SERVER_HOST }}
          port: ${{ secrets.US_SERVER_PORT || 22 }}
          username: ${{ secrets.US_SERVER_USER || 'root' }}
          password: ${{ secrets.US_SERVER_PASSWORD }}
          command_timeout: 10m
          timeout: 60s
          script: |
            set -e
            echo "==== [US Server] Start pulling latest code ===="
            cd /root/02project/py310sphinx_knowledge
            git checkout main
            git pull origin main
            echo "==== [US Server] Building Sphinx documentation ===="
            /root/miniconda3/envs/py310sphinx_knowledge/bin/sphinx-build -a -E -b html docs/source docs/build/html
            echo "==== [US Server] Deployment succeeded! ===="
